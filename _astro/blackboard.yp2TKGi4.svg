<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 500" width="1800" height="500" fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'DejaVu Serif', serif">
<!-- The page-top blackboard of "Lie Groups and Their Representation Theory". It is used as a CSS mask (black = ink), so its colour comes from the theme. Every formula is copied symbol for symbol from the course's canonical lecture sources. The English and Lithuanian sources have the same formula, so the board serves both languages, and it contains no words. Sub- and superscripts use dy shifts rather than baseline-shift, so they also render in Firefox. Each formula's source (EN line / LT line), checked on 2026-10-30 against lectures/lec01.tex sha256 d63f0e14…6057c6 / lie-groups-lt/lectures/lec01.tex 50bc5989…a35 and lectures/lec02.tex 074a7445…45a3 / lie-groups-lt/lectures/lec02.tex 6b5e1403…0f06 (full hashes in review/platform-port/batch14visual.md):
  left column
    exp X = e^X = sum_{k=0}^inf X^k/k!        lec02 Definition (Matrix exponential), EN 41 / LT 41
    [X,Y] = XY - YX                           lec01, EN 367 / LT 392
    Ad_g X = g X g^{-1}                       lec02 section "Conjugation and homomorphisms", EN 307 / LT 340
    det exp X = e^{tr X}                      lec02 Proposition (Properties of the matrix exponential) (v), EN 59 / LT 59
    g exp(X) g^{-1} = exp(g X g^{-1})         the same proposition (iv), EN 58 / LT 58
    (dL_g)_e : T_eG -> T_gG                   lec01, EN 298 / LT 313
  right column
    exp(Ad_g X) = g exp(X) g^{-1}             lec02 Theorem (Differentiating homomorphisms) (ii), for g in G and X in g, EN 313 / LT 346
    S^1 = {(x,y) in R^2 : x^2+y^2 = 1}        lec01 Example (A coordinate on the circle), EN 65 / LT 66
  Formulas that hold only under a hypothesis the board cannot show (the transposed commutator, the second-order term, the homomorphism identity) were removed on 2026-10-30 (review/platform-port/batch16art.md).
  The drawing in the middle redraws the TikZ figure after that example (lec01, EN 86-94 / LT 88-96) at 150 units per source unit, centred on the tile (x = 900): the unit circle, the arc from -55 to 55 degrees covered by one chart, the x and y axes, and the tangent arrow (0,a) at (1,0). As in the source, the arrow's length is schematic. Both formula columns lie within x = 300-1530, so a viewport 1280 px or wider (which shows the tile's middle) shows every formula whole. -->
